# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          shopt -s nullglob
          # Allowlist: only the portfolio is published. Project trees such as
          # android-app-manager/ and game-asset-gen/ stay in the repo and are
          # left out of the Pages artifact, along with any future top-level
          # directory that is not copied below.
          root_files=( *.html *.svg *.png *.jpg *.jpeg *.gif *.webp *.ico )
          if ((${#root_files[@]})); then
            cp -a "${root_files[@]}" _site/
          fi
          cp -a README.md assets demos vibe _site/
          echo "Pages artifact top-level:"
          ls -1 _site
          test ! -e _site/android-app-manager
          test ! -e _site/game-asset-gen
          test ! -e _site/CLAUDE.md
          test -f _site/index.html
          test -d _site/assets
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
